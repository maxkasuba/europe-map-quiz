<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Europe's 100 Largest Metro Areas — Map Quiz</title>
<style>
:root{--bg:#f4f1ea;--sea:#cfe0ea;--land:#fbf9f4;--border:#b9b3a6;--ink:#1f2a33;--muted:#6b7480;--dot:#2c3e50;--ok:#2e8b57;--bad:#c0392b;--hl:#f0a500}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid #ddd6c8;flex-wrap:wrap;background:#fff}
.prompt{flex:1;min-width:220px}
.prompt small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.prompt b{font-size:26px;font-weight:700}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat{text-align:center}.stat span{display:block;font-size:20px;font-weight:700}.stat small{color:var(--muted);font-size:11px;text-transform:uppercase}
button{font:inherit;border:1px solid #c9c2b3;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{background:#f3efe6}
.mapwrap{position:relative;flex:1;overflow:hidden;background:var(--sea);touch-action:none}
svg{width:100%;height:100%;display:block;cursor:crosshair}
.land path{fill:var(--land);stroke:var(--border);stroke-linejoin:round}
.dot{fill:var(--dot);stroke:#fff}
.dot.ok{fill:var(--ok)}.dot.bad{fill:var(--bad)}
.dot.target{fill:var(--hl);stroke:#7a5200}
.lbl{font-weight:700;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;padding:0;font-size:20px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;font-weight:600;color:#fff;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tip{position:absolute;pointer-events:none;background:#1f2a33;color:#fff;font-size:12px;padding:4px 7px;border-radius:5px;display:none;white-space:nowrap}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:#3d4a55;background:rgba(255,255,255,.8);padding:5px 9px;border-radius:6px}
.modal{position:absolute;inset:0;background:rgba(31,42,51,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.card{background:#fff;border-radius:12px;padding:22px 24px;max-width:520px;width:100%;max-height:85%;overflow:auto}
.card h2{margin:0 0 6px}.card ul{columns:2;padding-left:18px;font-size:14px}
</style></head><body>
